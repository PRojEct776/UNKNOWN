services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unknown-app
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - MODEL_NAME=${MODEL_NAME:-gemini-2.5-flash}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - COHERE_MODEL=${COHERE_MODEL:-command-a-03-2025}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openrouter/free}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - CLOUDFLARE_MODEL=${CLOUDFLARE_MODEL:-@cf/meta/llama-3.1-8b-instruct-fp8}
      - LLM_PROVIDER_ORDER=${LLM_PROVIDER_ORDER:-gemini,groq,cohere,openrouter,cloudflare}
      - LLM_TIMEOUT_S=${LLM_TIMEOUT_S:-10.0}
      - GEMINI_TIMEOUT_MS=${GEMINI_TIMEOUT_MS:-120000}
      - GEMINI_THINKING_LEVEL=${GEMINI_THINKING_LEVEL:-LOW}
      - TEMPERATURE=${TEMPERATURE:-0.2}
      - MAX_OUTPUT_TOKENS=${MAX_OUTPUT_TOKENS:-8192}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8000,http://localhost:3000,http://localhost:5173}
      - MAX_COLLECTION_PAPERS=${MAX_COLLECTION_PAPERS:-25}
      - MAX_FILE_SIZE_BYTES=${MAX_FILE_SIZE_BYTES:-52428800}
    volumes:
      - ./backend/datasets:/app/backend/datasets
      - ./backend/vector_store:/app/backend/vector_store
      - ./backend/app/data:/app/backend/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
