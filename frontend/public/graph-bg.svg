<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <!-- Ambient Nebular Gradients -->
    <radialGradient id="nebula-cyan" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#0891b2" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebula-violet" cx="80%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.16" />
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebula-emerald" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12" />
      <stop offset="70%" stop-color="#059669" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebula-amber" cx="70%" cy="20%" r="30%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="0" cy="0" r="1" fill="#00f0ff" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Deep Obsidian Canvas Base -->
  <rect width="100%" height="100%" fill="#070a12" />

  <!-- Soft Ambient Nebular Glows -->
  <rect width="100%" height="100%" fill="url(#nebula-cyan)" />
  <rect width="100%" height="100%" fill="url(#nebula-violet)" />
  <rect width="100%" height="100%" fill="url(#nebula-emerald)" />
  <rect width="100%" height="100%" fill="url(#nebula-amber)" />

  <!-- Cybernetic Grid Overlay -->
  <rect width="100%" height="100%" fill="url(#cyber-grid)" />

  <!-- Constellation Network Graphic -->
  <g stroke-width="0.8" stroke-opacity="0.25" fill-opacity="0.6">
    <!-- Network Lines -->
    <line x1="120" y1="140" x2="260" y2="90" stroke="#06b6d4" />
    <line x1="260" y1="90" x2="380" y2="180" stroke="#3b82f6" />
    <line x1="380" y1="180" x2="310" y2="320" stroke="#8b5cf6" />
    <line x1="310" y1="320" x2="160" y2="290" stroke="#10b981" />
    <line x1="160" y1="290" x2="120" y2="140" stroke="#06b6d4" />

    <line x1="380" y1="180" x2="550" y2="130" stroke="#06b6d4" stroke-dasharray="3,3" />
    <line x1="550" y1="130" x2="680" y2="210" stroke="#f59e0b" />
    <line x1="680" y1="210" x2="610" y2="380" stroke="#ec4899" />
    <line x1="610" y1="380" x2="440" y2="420" stroke="#8b5cf6" />
    <line x1="440" y1="420" x2="310" y2="320" stroke="#10b981" />

    <line x1="680" y1="210" x2="840" y2="160" stroke="#f59e0b" />
    <line x1="840" y1="160" x2="980" y2="240" stroke="#ec4899" />
    <line x1="980" y1="240" x2="920" y2="410" stroke="#8b5cf6" />
    <line x1="920" y1="410" x2="770" y2="460" stroke="#3b82f6" />
    <line x1="770" y1="460" x2="610" y2="380" stroke="#10b981" />

    <line x1="980" y1="240" x2="1110" y2="190" stroke="#06b6d4" stroke-dasharray="4,4" />
    <line x1="1110" y1="190" x2="1140" y2="340" stroke="#8b5cf6" />
    <line x1="1140" y1="340" x2="920" y2="410" stroke="#3b82f6" />

    <!-- Constellation Node Markers -->
    <circle cx="120" cy="140" r="3" fill="#06b6d4" />
    <circle cx="260" cy="90" r="4" fill="#3b82f6" />
    <circle cx="380" cy="180" r="3.5" fill="#8b5cf6" />
    <circle cx="310" cy="320" r="3" fill="#10b981" />
    <circle cx="160" cy="290" r="2.5" fill="#06b6d4" />

    <circle cx="550" cy="130" r="4.5" fill="#06b6d4" />
    <circle cx="680" cy="210" r="5" fill="#f59e0b" />
    <circle cx="610" cy="380" r="4" fill="#ec4899" />
    <circle cx="440" cy="420" r="3.5" fill="#8b5cf6" />

    <circle cx="840" cy="160" r="4" fill="#f59e0b" />
    <circle cx="980" cy="240" r="4.5" fill="#ec4899" />
    <circle cx="920" cy="410" r="3.5" fill="#8b5cf6" />
    <circle cx="770" cy="460" r="3" fill="#3b82f6" />

    <circle cx="1110" cy="190" r="3" fill="#06b6d4" />
    <circle cx="1140" cy="340" r="3.5" fill="#8b5cf6" />
  </g>

  <!-- Concentric Orbital Target Rings (Center Right) -->
  <g fill="none" stroke-opacity="0.12">
    <circle cx="600" cy="300" r="160" stroke="#06b6d4" stroke-width="1" stroke-dasharray="6,8" />
    <circle cx="600" cy="300" r="260" stroke="#8b5cf6" stroke-width="0.8" stroke-dasharray="4,6" />
    <circle cx="600" cy="300" r="380" stroke="#f59e0b" stroke-width="0.5" />
  </g>
</svg>
